<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة المشرف · راصد</title>
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d4f57">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* لوحة المشرف: نسب حضور المعلمين لعدة مدارس في شاشة واحدة */
:root{--bg:#f2f5f5;--surface:#fff;--tint:#f1f8f7;--ink:#10272b;--muted:#5f7376;--line:#e2e9e9;--accent:#0d4f57;--ok:#15803d;--late:#a65508;--bad:#b42318;
  --band:radial-gradient(120% 140% at 100% 0%,#1b8a8f 0%,#0d4f57 55%,#083a40 100%)}
@media (prefers-color-scheme:dark){:root{--bg:#0c1517;--surface:#142124;--tint:#132c2f;--ink:#e4efee;--muted:#9db1b0;--line:#24363a;--accent:#4cc3c0;--ok:#5fd394;--late:#f2b45a;--bad:#ff8f84;
  --band:radial-gradient(120% 140% at 100% 0%,#14666b 0%,#0a3a40 55%,#06282c 100%);color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--ink);background:var(--band) top/100% 200px no-repeat,var(--bg);font-size:15px;
  padding:0 max(16px,env(safe-area-inset-left,0px)) 40px}
.w{max-width:1000px;margin:0 auto}
header{color:#fff;padding:20px 0 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:22px;margin:0;display:flex;gap:10px;align-items:center}.mk{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center}
input[type=date]{font:inherit;border-radius:10px;border:0;padding:6px 10px}
.panel{background:var(--surface);border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(16,39,43,.08);display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.kpi{background:var(--tint);border-radius:14px;padding:12px}.kpi b{display:block;font-size:24px}.kpi span{font-size:13px;color:var(--muted)}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.sc{background:var(--tint);border-radius:16px;padding:14px;display:grid;gap:8px}
.sc h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line)}.bar i{display:block}.ok{color:var(--ok)}.late{color:var(--late)}.bad{color:var(--bad)}
.small{font-size:13px}.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}@media (prefers-color-scheme:dark){button.p{color:#06231c}}
.add{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px}@media (max-width:600px){.add{grid-template-columns:1fr 1fr}}
.add input{font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);min-width:0}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--line)}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style></head><body><div class="w">
<header><h1><span class="mk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0d4f57" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17 20 6"/></svg></span>لوحة المشرف</h1>
  <div style="display:flex;gap:8px;align-items:center"><input type="date" id="dt"><button id="rf">تحديث</button></div></header>
<div class="panel">
  <div class="kpis num" id="kp"></div>
  <div class="cards" id="cards"></div>
  <details id="mg"><summary>إضافة مدرسة أو إدارتها</summary>
    <p class="small muted">لكل مدرسة: رمز المدرسة من «الإعداد ← المزامنة»، ورمز المتابع (يكفي للاطلاع). البيانات تُحفظ على هذا الجهاز فقط.</p>
    <div class="add"><input id="aN" placeholder="اسم مختصر (اختياري)"><input id="aC" dir="ltr" placeholder="رمز المدرسة ABCD-2345"><input id="aK" type="password" placeholder="رمز المتابع"><button class="p" id="aB">إضافة</button></div>
    <div id="lst" class="small" style="margin-top:10px"></div></details>
</div>
<footer>راصد المبسّط · إعداد وتطوير: عبدالمجيد السيد · 0561955430</footer></div>
<script>
const SB='https://knrpjgppxdhkdyxcwroe.supabase.co/rest/v1/rpc/',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtucnBqZ3BweGRoa2R5eGN3cm9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5OTk4MzMsImV4cCI6MjEwNzU3NTgzM30.T_M5u9G1Ix9nMGCt2Ysm1bmiDzpBppOPsHdJTYVH6Qc';
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS='rased-sup-v1';let L=[];try{L=JSON.parse(localStorage.getItem(LS))||[]}catch(e){}
const saveL=()=>{try{localStorage.setItem(LS,JSON.stringify(L))}catch(e){}};
const pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let d0=new Date();while(d0.getDay()>4)d0.setDate(d0.getDate()-1);$('#dt').value=ymd(d0);
const ERR={bad:'رمز غير صحيح',none:'المدرسة غير موجودة',locked:'محاولات كثيرة، حاول لاحقًا'};
async function rpc(f,a){const r=await fetch(SB+f,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(a)});const j=await r.json();if(!r.ok)throw new Error(j.message||r.status);if(j.err)throw new Error(ERR[j.err]||j.err);return j}
const pct=o=>{const m=(o.ok||0)+(o.late||0)+(o.bad||0);return m?Math.round(((o.ok||0)+(o.late||0))/m*100):null};
function drawList(){$('#lst').innerHTML=L.length?L.map((x,i)=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(x.n||x.code)} <code dir="ltr">${esc(x.code)}</code></span><button data-del="${i}">حذف</button></div>`).join(''):'<span class="muted">لم تُضف مدارس بعد.</span>'}
async function load(){drawList();if(!L.length){$('#cards').innerHTML='<p class="muted">أضف المدارس من «إضافة مدرسة» بالأسفل.</p>';$('#mg').open=true;$('#kp').innerHTML='';return}
  $('#cards').innerHTML='<p class="muted">⏳ …</p>';
  try{const r=await rpc('lite_sup_stats',{p_items:L.map(x=>({code:x.code,key:x.key})),p_date:$('#dt').value});
    const ok=r.list.filter(x=>!x.err);const T={ok:0,late:0,bad:0,total:0},Wk={ok:0,late:0,bad:0};ok.forEach(x=>{['ok','late','bad'].forEach(k=>{T[k]+=x.today[k];Wk[k]+=x.week[k]});T.total+=x.total});
    const marked=T.ok+T.late+T.bad;
    $('#kp').innerHTML=`<div class="kpi"><b>${pct(T)??'—'}${pct(T)!=null?'%':''}</b><span>حضور اليوم (${ok.length} مدرسة)</span></div><div class="kpi"><b>${marked}/${T.total}</b><span>حصص مرصودة اليوم</span></div><div class="kpi"><b class="bad">${T.bad}</b><span>غياب اليوم</span></div><div class="kpi"><b>${pct(Wk)??'—'}${pct(Wk)!=null?'%':''}</b><span>حضور الأسبوع</span></div>`;
    const rows=r.list.map(x=>({...x,n:(L.find(y=>y.code.replace(/[^A-Z0-9]/gi,'').toUpperCase()===x.code)||{}).n})).sort((a,b)=>(a.err?1:0)-(b.err?1:0)||(pct(a.today||{})??101)-(pct(b.today||{})??101));
    $('#cards').innerHTML=rows.map(x=>{if(x.err)return `<div class="sc"><h3>${esc(x.n||x.code)}</h3><span class="bad small">${esc(ERR[x.err]||x.err)}</span></div>`;
      const t=x.today,m=t.ok+t.late+t.bad,w=v=>m?v/m*100:0,p=pct(t),pw=pct(x.week);
      return `<div class="sc"><h3><span>${esc(x.n||x.name)}</span><span class="${p==null?'muted':p>=95?'ok':p>=85?'late':'bad'}">${p==null?'—':p+'%'}</span></h3>
       <div class="bar"><i style="width:${w(t.ok)}%;background:var(--ok)"></i><i style="width:${w(t.late)}%;background:var(--late)"></i><i style="width:${w(t.bad)}%;background:var(--bad)"></i></div>
       <div class="small num">رُصد ${m} من ${x.total} · <span class="ok">حاضر ${t.ok}</span> · <span class="late">متأخر ${t.late}</span> · <span class="bad">غائب ${t.bad}</span></div>
       <div class="small muted">الأسبوع: ${pw==null?'—':pw+'%'}${x.plan_until<$('#dt').value?' · <span class="pill">الاشتراك منتهٍ</span>':''}</div>
       ${x.bad_list.length?`<div class="small">${x.bad_list.map(b=>{const[,p,c]=b.k.split('|');return `<div class="bad">• الأستاذ/ ${esc(b.t||'')} – الحصة ${esc(p)} – ${esc(c)}</div>`}).join('')}</div>`:''}</div>`}).join('');
  }catch(e){$('#cards').innerHTML=`<p class="bad">${esc(e.message)}</p>`}}
$('#aB').onclick=()=>{const code=$('#aC').value.toUpperCase().replace(/[^A-Z0-9]/g,''),key=$('#aK').value.trim();if(code.length!==8||!key){alert('رمز المدرسة 8 أحرف، ورمز المتابع مطلوب');return}
  L=L.filter(x=>x.code!==code);L.push({n:$('#aN').value.trim(),code,key});saveL();$('#aN').value=$('#aC').value=$('#aK').value='';load()};
document.addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d){L.splice(+d.dataset.del,1);saveL();load()}});
$('#rf').onclick=load;$('#dt').onchange=load;load();setInterval(load,120000);
</script></body></html>
