<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تسجيل جوال المعلم · راصد</title>
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d4f57">
<meta property="og:title" content="تسجيل جوال المعلم في راصد"><meta property="og:description" content="سجّل رقم جوالك لاستقبال تذكيرات الحصص الافتراضية"><meta property="og:image" content="https://rased-lite.wasl.uk/og.png">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* صفحة تسجيل جوال المعلم: نموذج واحد، لا يعرض أي رقم */
:root{--bg:#f2f5f5;--surface:#fff;--ink:#10272b;--muted:#5f7376;--line:#e2e9e9;--accent:#0d4f57;--ok:#15803d;--bad:#b42318;
  --band:radial-gradient(120% 140% at 100% 0%,#1b8a8f 0%,#0d4f57 55%,#083a40 100%)}
@media (prefers-color-scheme:dark){:root{--bg:#0c1517;--surface:#142124;--ink:#e4efee;--muted:#9db1b0;--line:#24363a;--accent:#4cc3c0;--ok:#5fd394;--bad:#ff8f84;
  --band:radial-gradient(120% 140% at 100% 0%,#14666b 0%,#0a3a40 55%,#06282c 100%);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:var(--ink);background:var(--band) top/100% 220px no-repeat,var(--bg);
  padding:0 max(16px,env(safe-area-inset-left,0px)) 40px}
.box{max-width:420px;margin:56px auto 0;background:var(--surface);border-radius:20px;padding:26px 22px;box-shadow:0 8px 30px rgba(16,39,43,.12);display:grid;gap:14px}
.mark{width:48px;height:48px;border-radius:14px;background:var(--accent);display:grid;place-items:center;justify-self:center}
h1{font-size:21px;margin:0;text-align:center}.sc{text-align:center;color:var(--muted);margin:-6px 0 0;font-size:14px}
label{display:grid;gap:5px;font-size:14px;font-weight:600}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
button{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:12px;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#06231c}}
button:disabled{opacity:.55}
.msg{font-size:14px;min-height:1.3em;text-align:center}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad)}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:0;line-height:1.7}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
</style></head><body>
<div class="box" id="box">
  <span class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17 20 6"/></svg></span>
  <h1>تسجيل جوال المعلم</h1><p class="sc" id="sc">…</p>
  <label>الاسم كما في منصة مدرستي<input id="nm" autocomplete="name" placeholder="مثال: خالد أحمد السالم"></label>
  <label>رقم الجوال (واتساب)<input id="ph" dir="ltr" inputmode="tel" autocomplete="tel" placeholder="05xxxxxxxx"></label>
  <label id="cdL" hidden>رمز المدرسة<input id="cd" dir="ltr" placeholder="ABCD-2345"></label>
  <button id="go">تسجيل</button>
  <div class="msg" id="msg" role="status"></div>
  <p class="note">يُستخدم الرقم لتذكيرك بالحصص الافتراضية فقط، ويصل إلى إدارة المدرسة وحدها، ولا يظهر في أي صفحة.</p>
</div>
<footer>راصد المبسّط · إعداد وتطوير: عبدالمجيد السيد</footer>
<script>
const SB='https://knrpjgppxdhkdyxcwroe.supabase.co/rest/v1/rpc/',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtucnBqZ3BweGRoa2R5eGN3cm9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5OTk4MzMsImV4cCI6MjEwNzU3NTgzM30.T_M5u9G1Ix9nMGCt2Ysm1bmiDzpBppOPsHdJTYVH6Qc';
const $=s=>document.querySelector(s);
const ERR={none:'رمز المدرسة غير صحيح، اطلب الرابط من إدارة المدرسة',phone:'رقم الجوال غير صحيح، اكتبه هكذا: 05xxxxxxxx',name:'اكتب اسمك الثلاثي كما في مدرستي',full:'اكتمل التسجيل لهذه المدرسة، تواصل مع الإدارة'};
async function rpc(f,a){const r=await fetch(SB+f,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(a)});
  const j=await r.json().catch(()=>null);if(!r.ok)throw new Error('تعذّر الاتصال، حاول مرة أخرى');if(j&&j.err)throw new Error(ERR[j.err]||j.err);return j}
let code=(new URLSearchParams(location.search).get('s')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function loadSchool(){if(code.length!==8){$('#sc').textContent='اكتب رمز المدرسة الذي وصلك';$('#cdL').hidden=false;return}
  try{const r=await rpc('lite_phone_school',{p_code:code});$('#sc').textContent=r.name||''}catch(e){$('#sc').textContent=e.message;$('#cdL').hidden=false}}
loadSchool();
$('#go').onclick=async()=>{const b=$('#go'),m=$('#msg');if(!$('#cdL').hidden){code=$('#cd').value.toUpperCase().replace(/[^A-Z0-9]/g,'')}
  const nm=$('#nm').value.trim(),ph=$('#ph').value.trim();if(!nm||!ph){m.innerHTML='<span class="bad">اكتب الاسم والجوال</span>';return}
  b.disabled=true;m.textContent='⏳ …';
  try{await rpc('lite_phone_submit',{p_code:code,p_name:nm,p_phone:ph});$('#box').innerHTML=`<span class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17 20 6"/></svg></span><h1>تم التسجيل</h1><p class="note" style="font-size:15px">شكرًا لك. ستصلك تذكيرات الحصص على هذا الرقم.</p>`}
  catch(e){m.innerHTML=`<span class="bad">${e.message.replace(/[<>&]/g,'')}</span>`;b.disabled=false}};
</script></body></html>
