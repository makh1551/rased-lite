name: نشر التحديث
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(jq -r .version extension/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: حزم الإضافة
        run: cd extension && zip -qr ../rased-auto.zip .
      - name: إصدار GitHub
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V="${{ steps.v.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" rased-auto.zip --clobber
          else
            gh release create "v$V" rased-auto.zip --title "راصد الآلي $V" --notes-file release-notes.txt
          fi
      - name: بناء الموقع
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p _site && cp -r docs/* _site/ && cp rased-auto.zip _site/
          jq -n --arg v "$V" --arg n "$(head -1 release-notes.txt)" \
            --arg z "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/rased-auto.zip" \
            '{version:$v, notes:$n, zip:$z}' > _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
