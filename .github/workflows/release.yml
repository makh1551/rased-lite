name: نشر التحديث
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(jq -r .version extension/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: حزم الإضافة
        run: cd extension && zip -qr ../rased-auto.zip .
      - name: إصدار GitHub
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V="${{ steps.v.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" rased-auto.zip --clobber
          else
            gh release create "v$V" rased-auto.zip --title "راصد الآلي $V" --notes-file release-notes.txt
          fi
      - name: رفع التحديث لمتجر Edge (إن وُجدت المفاتيح)
        env:
          PID: "${{ secrets.EDGE_PRODUCT_ID }}"
          CID: "${{ secrets.EDGE_CLIENT_ID }}"
          KEY: "${{ secrets.EDGE_API_KEY }}"
        run: |
          if [ -z "$PID" ] || [ -z "$CID" ] || [ -z "$KEY" ]; then echo "لا توجد مفاتيح متجر Edge – تخطّي"; exit 0; fi
          API="https://api.addons.microsoftedge.microsoft.com/v1/products/$PID/submissions"
          H=(-H "Authorization: ApiKey $KEY" -H "X-ClientID: $CID")
          OP=$(curl -sSi -X POST "$API/draft/package" "${H[@]}" -H "Content-Type: application/zip" --data-binary @rased-auto.zip | awk -F': ' 'tolower($1)=="location"{print $2}' | tr -d '\r')
          for i in $(seq 1 30); do S=$(curl -sS "$API/draft/package/operations/$OP" "${H[@]}" | jq -r .status); echo "رفع الحزمة: $S"; [ "$S" = "InProgress" ] || break; sleep 10; done
          [ "$S" = "Succeeded" ] || { echo "فشل رفع الحزمة"; exit 1; }
          OP=$(curl -sSi -X POST "$API" "${H[@]}" -H "Content-Type: text/plain" --data-binary "$(head -1 release-notes.txt)" | awk -F': ' 'tolower($1)=="location"{print $2}' | tr -d '\r')
          for i in $(seq 1 30); do R=$(curl -sS "$API/operations/$OP" "${H[@]}"); S=$(echo "$R" | jq -r .status); echo "الإرسال للمراجعة: $S"; [ "$S" = "InProgress" ] || break; sleep 10; done
          echo "$R"; [ "$S" = "Succeeded" ] || { echo "::warning::لم يُرسل التحديث للمتجر"; }
      - name: بناء الموقع
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p _site && cp -r docs/* _site/ && cp rased-auto.zip _site/
          jq -n --arg v "$V" --arg n "$(head -1 release-notes.txt)" \
            --arg z "https://rased-lite.wasl.uk/rased-auto.zip" \
            '{version:$v, notes:$n, zip:$z}' > _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
