<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>استبيان احتياجات الجهات · رايا لوب</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0B2B55">
<meta property="og:title" content="استبيان قصير: ما احتياجات جهتكم؟"><meta property="og:description" content="دقيقتان تساعدنا نعرف احتياجات الجمعيات في الحوكمة وتنمية الموارد."><meta property="og:image" content="https://rayaloop.wasl.uk/dl/maher/group/group-navy.png">
<link rel="icon" href="assets/img/mark-color.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F3F5F9;--card:#fff;--fg:#0E1A2B;--muted:#5A6577;--line:#DDE2EA;--navy:#0B2B55;--blue:#1B5296;--chip:#E6EAF0;--bad:#B42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,Tahoma,sans-serif;line-height:1.6}
.hero{background:linear-gradient(150deg,#123A6E,#0B2B55 55%,#051631);color:#fff;padding:26px 0 54px}
.in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero img{width:56px}.hero h1{margin:10px 0 4px;font-size:1.5rem}.hero p{margin:0;color:#C9CFD9}
form,.done{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:-34px;display:flex;flex-direction:column;gap:18px;box-shadow:0 12px 30px rgba(11,43,85,.08)}
.f{display:flex;flex-direction:column;gap:6px;border:0;padding:0;margin:0;min-width:0}.f>label,.f legend{font-weight:600;font-size:.95rem;padding:0}.f small{color:var(--muted)}
.req::after{content:" *";color:var(--bad)}
input[type=text],input[type=tel],input[type=email],select,textarea{font:inherit;font-size:1rem;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#F8FAFC;color:var(--fg);width:100%}
textarea{min-height:90px;resize:vertical}
.ch{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ch label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;font-size:.95rem}
.ch input{width:18px;height:18px;accent-color:var(--navy)}.ch label:has(input:checked){border-color:var(--navy);background:var(--chip)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.two{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:.85rem;min-height:0}.f.bad input,.f.bad select{border-color:var(--bad)}
.ok{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;color:var(--muted)}.ok input{margin-top:5px;accent-color:var(--navy)}
button{font:inherit;font-weight:700;font-size:1.05rem;background:var(--navy);color:#fff;border:0;border-radius:13px;padding:14px;cursor:pointer}button:disabled{opacity:.6}
.hp{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}.done{text-align:center;align-items:center}.done h2{margin:0;color:var(--navy)}.done a{color:var(--blue);font-weight:600}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 0}
[hidden]{display:none!important}
</style></head><body>
<header class="hero"><div class="in"><img src="assets/img/mark-white.svg" alt="رايا لوب"><h1>ما احتياجات جهتكم؟</h1><p>استبيان قصير في دقيقتين، يساعدنا نعرف أولويات الجمعيات في الحوكمة وتنمية الموارد، ونتواصل معكم بما يفيدكم.</p></div></header>
<main class="in">
<form id="sv" novalidate>
<div class="f"><label for="org" class="req">اسم الجهة</label><input type="text" id="org" name="org" autocomplete="organization"><span class="err"></span></div>
<div class="two">
<div class="f"><label for="kind">نوع الجهة</label><select id="kind" name="kind"><option value="">اختر</option><option>جمعية أهلية</option><option>مؤسسة أهلية</option><option>وقف</option><option>جهة حكومية</option><option>شركة / قطاع خاص</option><option>أخرى</option></select></div>
<div class="f"><label for="region">المنطقة</label><select id="region" name="region"><option value="">اختر</option><option>الرياض</option><option>مكة المكرمة</option><option>المدينة المنورة</option><option>القصيم</option><option>المنطقة الشرقية</option><option>عسير</option><option>تبوك</option><option>حائل</option><option>الحدود الشمالية</option><option>جازان</option><option>نجران</option><option>الباحة</option><option>الجوف</option></select></div>
</div>
<fieldset class="f" id="needsF"><legend class="req">أبرز احتياجاتكم الآن</legend><small>اختر كل ما ينطبق</small>
<div class="ch">
<label><input type="checkbox" name="needs" value="الحوكمة والامتثال">الحوكمة والامتثال</label>
<label><input type="checkbox" name="needs" value="تنمية الموارد المالية">تنمية الموارد المالية</label>
<label><input type="checkbox" name="needs" value="اللوائح والسياسات">اللوائح والسياسات</label>
<label><input type="checkbox" name="needs" value="التخطيط الاستراتيجي">التخطيط الاستراتيجي</label>
<label><input type="checkbox" name="needs" value="المشاريع المدرة للدخل والأوقاف">المشاريع المدرة للدخل والأوقاف</label>
<label><input type="checkbox" name="needs" value="قياس الأداء والأثر">قياس الأداء والأثر</label>
<label><input type="checkbox" name="needs" value="بناء القدرات والتدريب">بناء القدرات والتدريب</label>
<label><input type="checkbox" name="needs" value="التحول الرقمي">التحول الرقمي</label>
</div><span class="err"></span></fieldset>
<div class="f"><label for="when">متى تحتاجون الدعم؟</label><select id="when" name="when"><option value="">اختر</option><option>خلال شهر</option><option>خلال ٣ أشهر</option><option>خلال هذا العام</option><option>للاطلاع فقط حاليًا</option></select></div>
<div class="f"><label for="note">ما أكبر تحدٍّ يواجهكم؟ (اختياري)</label><textarea id="note" name="note"></textarea></div>
<div class="two">
<div class="f"><label for="name" class="req">الاسم</label><input type="text" id="name" name="name" autocomplete="name"><span class="err"></span></div>
<div class="f"><label for="role">الصفة</label><input type="text" id="role" name="role" placeholder="مثال: المدير التنفيذي"></div>
</div>
<div class="two">
<div class="f"><label for="phone" class="req">الجوال</label><input type="tel" id="phone" name="phone" dir="ltr" placeholder="05xxxxxxxx" autocomplete="tel"><span class="err"></span></div>
<div class="f"><label for="email">البريد الإلكتروني</label><input type="email" id="email" name="email" dir="ltr" autocomplete="email"><span class="err"></span></div>
</div>
<input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<label class="ok"><input type="checkbox" id="consent" checked>أوافق على تواصل رايا لوب معي بخصوص احتياجات الجهة.</label>
<button type="submit" id="go">إرسال</button><p class="err" id="fail" role="alert"></p>
</form>
<div class="done" id="done" hidden><img src="assets/img/mark-color.svg" alt="" style="width:64px"><h2>وصلتنا إجابتكم، شكرًا لكم</h2><p>سنتواصل معكم قريبًا بإذن الله. وللاطلاع على خدماتنا: <a href="https://rayaloop.com">rayaloop.com</a></p></div>
</main><footer>رايا لوب · بإشراف ماهر الجعيد</footer>
<script>
(function(){
var f=document.getElementById('sv'),go=document.getElementById('go'),fail=document.getElementById('fail');
function val(n){var e=f.elements[n];return e?String(e.value||'').trim():''}
function bad(el,t){var b=el.closest('.f');b.classList.add('bad');var e=b.querySelector('.err');if(e)e.textContent=t}
f.addEventListener('input',function(e){var b=e.target.closest('.f');if(b){b.classList.remove('bad');var x=b.querySelector('.err');if(x)x.textContent=''}});
f.addEventListener('submit',function(e){e.preventDefault();fail.textContent='';
 var needs=[].slice.call(f.querySelectorAll('input[name=needs]:checked')).map(function(i){return i.value});
 var ok=true;
 if(!val('org')){bad(f.elements.org,'اكتب اسم الجهة');ok=false}
 if(!needs.length){bad(document.getElementById('needsF').querySelector('.ch'),'اختر احتياجًا واحدًا على الأقل');ok=false}
 if(!val('name')){bad(f.elements.name,'اكتب اسمك');ok=false}
 var ph=val('phone');if(!/^[+\d][\d\s-]{6,18}$/.test(ph)){bad(f.elements.phone,'اكتب رقم جوال صحيح');ok=false}
 var em=val('email');if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){bad(f.elements.email,'صيغة البريد غير صحيحة');ok=false}
 if(!ok){var first=f.querySelector('.f.bad input,.f.bad select');if(first)first.focus();return}
 var lines=['استبيان احتياجات الجهات (قروبات ماهر الجعيد)','نوع الجهة: '+(val('kind')||'-'),'المنطقة: '+(val('region')||'-'),'الاحتياجات: '+needs.join('، '),'التوقيت: '+(val('when')||'-'),'الصفة: '+(val('role')||'-'),'أكبر تحدٍّ: '+(val('note')||'-'),'الموافقة على التواصل: '+(document.getElementById('consent').checked?'نعم':'لا')];
 var d={type:'service',org:val('org'),name:val('name'),phone:ph,email:em,service:'استبيان احتياجات: '+needs.join('، '),message:lines.join('\n'),lang:'ar',hp:f.elements.website.value,page:location.href};
 go.disabled=true;go.textContent='جارٍ الإرسال…';
 fetch('https://rayaloop.com/api/contact',{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(d)})
 .then(function(){f.hidden=true;document.getElementById('done').hidden=false;window.scrollTo(0,0)})
 .catch(function(){var wa='https://wa.me/966553813109?text='+encodeURIComponent(lines.concat(['الجهة: '+d.org,'الاسم: '+d.name,'الجوال: '+ph]).join('\n'));
  fail.innerHTML='تعذّر الإرسال الآن. أرسل إجاباتك عبر <a href="'+wa+'">واتساب</a>.';go.disabled=false;go.textContent='إرسال'});
});})();
</script></body></html>
