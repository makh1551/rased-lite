<title>راصد المبسّط</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* هوية راصد: شريط علوي بتدرّج التيل الداكن، وبطاقة بيضاء تعلوه، وخط IBM Plex Sans Arabic */
:root{
  --bg:#f2f5f5; --surface:#ffffff; --sunk:#e7eeee; --tint:#f1f8f7; --ink:#10272b; --muted:#5f7376; --line:#e2e9e9;
  --accent:#0d4f57; --accent-ink:#ffffff; --accent-soft:#e4f2f1; --teal:#1b8a8f;
  --ok:#15803d; --ok-soft:#e3f3e8; --late:#a65508; --late-soft:#fdf0d8; --bad:#b42318; --bad-soft:#fde7e4;
  --band:radial-gradient(120% 140% at 100% 0%,#1b8a8f 0%,#0d4f57 55%,#083a40 100%);
  --sh:0 1px 2px rgba(16,39,43,.05),0 4px 14px rgba(16,39,43,.06);
  --font-display:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --font-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1517; --surface:#142124; --sunk:#1b2a2d; --tint:#132c2f; --ink:#e4efee; --muted:#9db1b0; --line:#24363a;
  --accent:#4cc3c0; --accent-ink:#06231c; --accent-soft:#173a3e; --teal:#4cc3c0;
  --ok:#5fd394; --ok-soft:#16301f; --late:#f2b45a; --late-soft:#3a2a12; --bad:#ff8f84; --bad-soft:#3c1b18;
  --band:radial-gradient(120% 140% at 100% 0%,#14666b 0%,#0a3a40 55%,#06282c 100%); --sh:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1517; --surface:#142124; --sunk:#1b2a2d; --tint:#132c2f; --ink:#e4efee; --muted:#9db1b0; --line:#24363a;
  --accent:#4cc3c0; --accent-ink:#06231c; --accent-soft:#173a3e; --teal:#4cc3c0;
  --ok:#5fd394; --ok-soft:#16301f; --late:#f2b45a; --late-soft:#3a2a12; --bad:#ff8f84; --bad-soft:#3c1b18;
  --band:radial-gradient(120% 140% at 100% 0%,#14666b 0%,#0a3a40 55%,#06282c 100%); --sh:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--band) top/100% 230px no-repeat,var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.3}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.top{padding-block:18px 14px;color:#fff}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:26px;color:#fff;display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.school{font-size:13px;color:var(--muted);font-weight:500}
.clock{font-family:var(--font-display);font-size:22px;letter-spacing:.02em}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.top .tabs a{color:rgba(255,255,255,.78)}
.top .tabs a[aria-current="page"]{background:#fff;color:#0d4f57}
.top .mark{background:#fff;width:40px;height:40px;border-radius:12px}.top .mark svg{stroke:#0d4f57;width:22px;height:22px}
.top .school{color:rgba(255,255,255,.8)}
.top .clock{color:#fff}
.top .demo-bar{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.18)}
.top .demo-bar b{color:#fff}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:4px 16px 20px;margin-top:6px;min-width:0}
.panel .row,.panel .card,.panel .stat,.panel .per,.panel .empty{background:var(--tint)}
.panel .tbl{background:var(--surface)}
.demo-bar{margin-top:14px;background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo-bar b{color:var(--accent)}

/* period strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:16px}
.per{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 4px 5px;text-align:center;line-height:1.25;min-width:0}
.per b{display:block;font-family:var(--font-display);font-size:17px}
.per span{font-size:11px;color:var(--muted)}
.per[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.per[aria-pressed="true"] span{color:inherit;opacity:.85}
.per.live{box-shadow:inset 0 -3px 0 var(--late)}
.per.skip{opacity:.45}
.daybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.daybar h2{font-size:22px}
.daybar input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.late{background:var(--late-soft);color:var(--late)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

/* progress */
.prog{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk);margin-top:12px}
.prog i{display:block}
.prog .ok{background:var(--ok)} .prog .late{background:var(--late)} .prog .bad{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink)}

/* class cards */
.list{display:grid;gap:8px;margin-top:16px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.row[data-st="ok"]{border-inline-start:4px solid var(--ok)}
.row[data-st="late"]{border-inline-start:4px solid var(--late)}
.row[data-st="bad"]{border-inline-start:4px solid var(--bad)}
.who{min-width:0}
.cls{font-family:var(--font-display);font-size:17px}
.tch{font-size:14px;color:var(--muted)}
.les{font-size:12.5px;color:var(--muted);max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="ok"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="late"]{background:var(--late);color:#fff}
.seg button[aria-pressed="true"][data-v="bad"]{background:var(--bad);color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{color:var(--ok)}
.btn.wa.hot{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:16px;height:16px;flex:none}
.note{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.note .sent{color:var(--ok);font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);margin-top:16px}
@media (max-width:640px){.row{grid-template-columns:1fr}.acts{justify-content:flex-start}.per span{font-size:10px}.clock{font-size:18px}}

/* reports */
.section{margin-top:22px}
.section>h3{font-size:16px;margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.late b{color:var(--late)} .stat.bad b{color:var(--bad)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);letter-spacing:.02em}
tr:last-child td{border-bottom:0}
td.c{text-align:center}
.mini{display:flex;gap:2px;height:6px;width:120px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.mini i{display:block}
.mini .ok{background:var(--ok)} .mini .late{background:var(--late)} .mini .bad{background:var(--bad)}
.bar-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
pre.msg{white-space:pre-wrap;background:var(--sunk);border-radius:var(--r);padding:14px;font-family:var(--font-body);font-size:14px;margin:0;max-height:340px;overflow:auto}

/* setup */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:15px;min-width:0;width:100%}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.times div{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px}
.times b{font-family:var(--font-display);padding-inline:4px}
.times input{border:0;background:none;min-width:0;width:100%;font-size:13px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.steps{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:14px}
.cols{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cols code{background:var(--sunk);border-radius:6px;padding:2px 8px;font-family:var(--font-body);font-size:13px}

/* lock */
.lock{max-width:380px;width:100%;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:28px 22px;margin:70px auto 0;text-align:center;display:grid;gap:14px}
.lock #pin{width:100%;min-width:0;text-align:center;font-size:24px;letter-spacing:.4em;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}

.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.shot{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 7px;font-size:12px;font-weight:600}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:30;display:grid;place-items:center;align-content:center;gap:12px;padding:16px}
.lb img{max-width:100%;max-height:82vh;border-radius:8px}
.alertbar{background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px}
.tlink{border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;display:flex;justify-content:center;align-items:flex-start;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sheet>div{background:var(--bg);border-radius:14px;max-width:780px;width:100%;padding:16px;display:grid;gap:12px;min-width:0}
.join{text-align:start;border-top:1px solid var(--line);padding-top:12px}
.join summary{cursor:pointer;font-weight:600;color:var(--accent)}
.join input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;color:var(--ink)}
.top .pill{background:rgba(255,255,255,.16);color:#fff}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.45);color:#fff;padding:3px 12px;font-size:12px}
.credit{display:inline-flex;gap:6px;align-items:center}
.autobar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
footer{margin-top:40px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== متابعون، معالج، تثبيت ===== */
.folrow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;background:var(--surface);border-radius:12px;padding:10px}
.folrow .pers{display:flex;gap:4px;flex-wrap:wrap}
.folrow .pers label{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:32px;border-radius:8px;background:var(--sunk);font-weight:600;cursor:pointer;font-size:13px}
.folrow .pers input{position:absolute;opacity:0;pointer-events:none}
.folrow .pers label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.folrow .top-r{display:flex;gap:6px;align-items:center}
.folrow .top-r input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.wiz-steps{display:flex;gap:6px}.wiz-steps i{flex:1;height:4px;border-radius:4px;background:var(--sunk)}.wiz-steps i.on{background:var(--accent)}
textarea.pastebox{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:13px;color:var(--ink);direction:rtl}
.picklist{display:grid;gap:8px}
.picklist button{justify-content:center;min-height:44px;font-size:16px}
.bulk-row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--tint);border-radius:12px;padding:10px 12px}
.per.mine{box-shadow:inset 0 -3px 0 var(--teal)}
/* ===== تبسيط وسلاسة ===== */
:where(#app svg){width:18px;height:18px;flex:none;vertical-align:-3px}
body{background:var(--band) top/100% 190px no-repeat,var(--bg);font-size:15px}
.top{padding-block:16px 12px}
.brand h1{font-size:22px}
.top .mark{width:34px;height:34px;border-radius:10px}.top .mark svg{width:18px;height:18px}
.tabs{gap:2px;margin-top:10px}
.tabs a{padding:6px 14px;font-size:14px;transition:background .15s,color .15s}
.panel{padding:6px 18px 22px;border-radius:18px}
.panel.enter{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.daybar h2{font-size:20px}
.section{margin-top:18px}
.section>h3{font-size:15px;color:var(--ink)}
.panel .row,.panel .card,.panel .stat,.panel .empty{border:0;background:var(--tint);box-shadow:none}
.panel .per{border:1px solid transparent;background:var(--tint)}
.panel .per[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{border-radius:14px;padding:12px 14px}
.row[data-st]{border-inline-start:0;position:relative;overflow:hidden}
.row[data-st="ok"]::before,.row[data-st="late"]::before,.row[data-st="bad"]::before{content:"";position:absolute;inset-block:10px;inset-inline-start:0;width:4px;border-radius:0 4px 4px 0}
.row[data-st="ok"]::before{background:var(--ok)}.row[data-st="late"]::before{background:var(--late)}.row[data-st="bad"]::before{background:var(--bad)}
.btn{border-radius:10px;min-height:36px;transition:border-color .15s,background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.seg{border-radius:10px;border:0;background:var(--sunk)}
.seg button{min-height:36px;transition:background .15s,color .15s}
.seg button+button{border-inline-start:0}
.tbl{border:0;border-radius:14px;background:var(--tint)}
.panel .tbl{background:var(--tint)}
th{background:transparent}
.drop{padding:14px;border-radius:14px;background:var(--surface)}
.drop b{display:inline-flex;gap:8px;align-items:center}
.demo-bar{border-radius:12px;padding:10px 14px}
.stat b{font-size:24px}
.prog{height:6px;margin-top:14px}
.fold-h{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:var(--tint);border-radius:14px;margin:0!important;user-select:none}
.fold-h::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-top:-4px}
.section.closed>.fold-h::after{transform:rotate(135deg);margin-top:2px}
.section.closed>:not(.fold-h){display:none!important}
.section.fold{margin-top:10px}
.section.fold>.card{margin-top:8px}
@media (prefers-reduced-motion:reduce){.panel.enter{animation:none}}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ============ ثوابت ============ */
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const KEY='rased-lite-v1';
const DEF_TIMES=[['07:45','08:24'],['08:25','09:04'],['09:05','09:44'],['09:45','10:24'],['10:25','11:04'],['11:05','11:44'],['11:45','12:24']];
const ST={ok:'حاضر',late:'متأخر',bad:'غائب'};
const IC={
 teams:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>',
 wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3z"/></svg>',
 dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>',
 copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9m-5 5 5-5 5 5M5 4h14"/></svg>'
};

/* ============ أدوات ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');

function demoState(){
  const classes=['الأول أ','الثاني أ','الثالث أ','الرابع أ','الخامس أ','السادس أ'];
  const T=[['سالم العتيبي'],['فهد القحطاني'],['ناصر الشمري'],['عمر الزهراني'],['يوسف الغامدي'],['بدر الحربي'],['سعود الدوسري'],['تركي العنزي'],['إبراهيم السبيعي']]
    .map((x,i)=>({t:x[0],ph:'05500000'+pad(i+1)}));
  const rows=[];
  for(let d=0;d<5;d++)for(let p=1;p<=7;p++)classes.forEach((c,ci)=>{const k=(ci+p+d)%9;const T0=T[k];
    rows.push({d,p,c,t:T0.t,ph:T0.ph,l:((d+p*2+ci)%11===0)?'':`https://teams.microsoft.com/l/meetup-join/demo-${d}${p}${ci}`})});
  // تاريخ مرجعي: اليوم إن كان يوم دوام وإلا آخر خميس
  let a=ymd(new Date());while(wd(a)<0)a=addD(a,-1);
  const start=addD(a,-wd(a)), marks={}, sent={};
  const nowP=curPeriod(DEF_TIMES).idx;
  for(let k=0;k<=wd(a);k++){const date=addD(start,k);const isA=date===ymd(new Date());
    const maxP=k<wd(a)?7:(isA?Math.max(1,nowP-1):5);
    for(let p=1;p<=maxP;p++)classes.forEach((c,ci)=>{const r=rows.find(x=>x.d===k&&x.p===p&&x.c===c);if(!r||!r.l)return;
      const h=(k*7+p*13+ci*31)%23;let st='ok';
      if(h===0||h===7||(r.t==='يوسف الغامدي'&&p%3===0))st='bad';else if(h===3||h===11||h===19)st='late';
      marks[mk(date,p,c)]={st,at:DEF_TIMES[p-1][0].replace(/:(\d\d)/,(m,x)=>':'+pad(+x+4))};
      if(st!=='ok')sent[mk(date,p,c)]=DEF_TIMES[p-1][0].replace(/:(\d\d)/,(m,x)=>':'+pad(+x+3));});}
  return{demo:true,settings:{school:'ابتدائية النموذج (مدرسة تجريبية)',mgr:'خالد المالكي',mgrPh:'0550000099',pin:'1234',fpin:'5678',times:DEF_TIMES.map(x=>x.slice())},rows,marks,sent};
}

function curPeriod(times){const n=new Date(),m=n.getHours()*60+n.getMinutes();
  for(let i=0;i<times.length;i++){if(m>=mins(times[i][0])&&m<=mins(times[i][1]))return{idx:i+1,state:'live'}}
  for(let i=0;i<times.length;i++){if(mins(times[i][0])>m)return{idx:i+1,state:'next'}}
  return{idx:times.length,state:'done'}}

function tally(list,date){const o={ok:0,late:0,bad:0,un:0,nl:0,total:list.length};

function dayReport(date){const d=wd(date);const all=S.rows.filter(r=>r.d===d);const t=tally(all,date);
  const marked=t.ok+t.late+t.bad;const pct=marked?Math.round((t.ok+t.late)/marked*100):0;
  const lines=[`📋 تقرير حضور المعلمين – ${S.settings.school}`,`${DAYS[d]} ${fmtDate(date)}`,'',
    `✅ حاضر: ${t.ok} · ⏱ متأخر: ${t.late} · ❌ غائب: ${t.bad}`,`نسبة الحضور: ${pct}% من ${marked} حصة مرصودة`+(t.un?` · لم يُرصد: ${t.un}`:'')];
  const bad=all.filter(r=>S.marks[mk(date,r.p,r.c)]?.st==='bad').sort((a,b)=>a.p-b.p);
  const late=all.filter(r=>S.marks[mk(date,r.p,r.c)]?.st==='late').sort((a,b)=>a.p-b.p);
  if(bad.length){lines.push('','❌ الغياب:');bad.forEach(r=>lines.push(`• الأستاذ/ ${r.t} – الحصة ${r.p} – ${r.c}`))}
  if(late.length){lines.push('','⏱ التأخر:');late.forEach(r=>lines.push(`• الأستاذ/ ${r.t} – الحصة ${r.p} – ${r.c}`))}
  if(typeof AUTO!=='undefined'&&AUTO._date===date){const low=all.filter(r=>isLow(AUTO[mk(date,r.p,r.c)])).sort((a,b)=>a.p-b.p);
    if(low.length){lines.push('','👥 حضور طلاب ضعيف (أقل من '+LOWN+'):');low.forEach(r=>lines.push(`• الأستاذ/ ${r.t} – الحصة ${r.p} – ${r.c}`))}}
  const rem=all.filter(r=>S.sent[mk(date,r.p,r.c)]);if(rem.length){const ok=rem.filter(r=>['ok','late'].includes(S.marks[mk(date,r.p,r.c)]?.st)),no=rem.filter(r=>S.marks[mk(date,r.p,r.c)]?.st==='bad');
    lines.push('',`📩 التذكيرات: ${rem.length} · استجاب ${ok.length}`+(no.length?` · لم يستجب ${no.length}`:''));no.sort((a,b)=>a.p-b.p).forEach(r=>lines.push(`• لم يستجب: الأستاذ/ ${r.t} – الحصة ${r.p} – ${r.c}`))}
  if(!bad.length&&!late.length&&marked)lines.push('','حضور كامل في كل الحصص المرصودة.');
  return{t,pct,marked,bad,late,text:lines.join('\n')}}

function rangeData(days,kind){const per={};const T={ok:0,late:0,bad:0,un:0};const byDay=[];
  days.forEach(ds=>{const k=wd(ds);if(k<0)return;const all=S.rows.filter(r=>r.d===k);const t=tally(all,ds);byDay.push({ds,k,t});['ok','late','bad'].forEach(x=>T[x]+=t[x]);
    all.forEach(r=>{const m=S.marks[mk(ds,r.p,r.c)];if(!m)return;const name=m.t||r.t;const o=per[name]||(per[name]={t:name,ok:0,late:0,bad:0,list:[]});o[m.st]++;
      if(m.st==='bad')o.list.push(kind==='month'?`${+ds.slice(8)}/${+ds.slice(5,7)} ح${r.p}`:`${DAYS[k]} ح${r.p}`)})});
  const teachers=Object.values(per).map(o=>({...o,n:o.ok+o.late+o.bad,pct:Math.round((o.ok+o.late)/Math.max(1,o.ok+o.late+o.bad)*100)}))
    .sort((a,b)=>b.bad-a.bad||b.late-a.late||a.t.localeCompare(b.t,'ar'));
  const marked=T.ok+T.late+T.bad,pct=marked?Math.round((T.ok+T.late)/marked*100):0;
  const rep=teachers.filter(o=>o.bad>=(kind==='month'?3:2));
  const from=days[0],to=days[days.length-1];
  const title=kind==='month'?'التقرير الشهري':'التقرير الأسبوعي';
  const span=kind==='month'?`شهر ${pd(from).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{month:'long',year:'numeric'})}`:`من ${fmtDate(from)} إلى ${fmtDate(to)}`;
  const lines=[`📊 ${title} – ${S.settings.school}`,span,'',`✅ نسبة حضور المعلمين: ${pct}% (${T.ok+T.late} من ${marked} حصة)`,`❌ غياب: ${T.bad} · ⏱ تأخر: ${T.late}`];
  if(rep.length){lines.push('','🔁 تكرر غيابهم:');rep.forEach(o=>lines.push(`• الأستاذ/ ${o.t}: ${o.bad===2?'حصتان':o.bad+' حصص'}`))}
  return{kind,title,span,days,from,to,byDay,teachers,T,pct,marked,rep,text:lines.join('\n')}}
function weekData(date){let d=date;while(wd(d)<0)d=addD(d,-1);const start=addD(d,-wd(d));return rangeData([0,1,2,3,4].map(k=>addD(start,k)),'week')}
function monthData(date){const y=+date.slice(0,4),m=+date.slice(5,7),n=new Date(y,m,0).getDate();const days=[];
  for(let i=1;i<=n;i++){const ds=`${y}-${pad(m)}-${pad(i)}`;if(wd(ds)>=0)days.push(ds)}return rangeData(days,'month')}
function teachersTable(W){return W.teachers.length?`<div class="tbl"><table class="num"><thead><tr><th>المعلم</th><th>مرصودة</th><th>حاضر</th><th>متأخر</th><th>غائب</th><th>النسبة</th><th>مواضع الغياب</th></tr></thead><tbody>
   ${W.teachers.map(o=>`<tr><td><button class="tlink" data-teacher="${esc(o.t)}">الأستاذ/ ${esc(o.t)}</button>${W.rep.includes(o)?` <span class="pill bad">تكرر</span>`:''}</td><td class="c">${o.n}</td><td class="c">${o.ok}</td><td class="c">${o.late}</td><td class="c" style="color:${o.bad?'var(--bad)':''}">${o.bad}</td><td class="c">${o.pct}%</td><td class="small muted">${esc(o.list.join('، '))}</td></tr>`).join('')}
   </tbody></table></div>`:`<div class="empty">لا رصد في هذه المدة بعد.</div>`}
function monthView(){const W=monthData(V.date),T=W.T;const weeks={};
  W.byDay.forEach(x=>{const st=addD(x.ds,-x.k);const o=weeks[st]||(weeks[st]={s:x.ds,e:x.ds,ok:0,late:0,bad:0,un:0});o.e=x.ds;['ok','late','bad','un'].forEach(q=>o[q]+=x.t[q])});
  return dayBar('تقرير الشهر')+`<p class="muted small" style="margin:4px 0 0">${esc(W.span)}</p>
   <div class="section stats num"><div class="stat"><b>${W.pct}%</b><span>نسبة الحضور</span></div><div class="stat ok"><b>${T.ok}</b><span>حاضر</span></div>

   <div class="section"><h3>الأسابيع</h3><div class="tbl"><table class="num"><thead><tr><th>الأسبوع</th><th>حاضر</th><th>متأخر</th><th>غائب</th><th>لم يُرصد</th><th>النسبة</th></tr></thead><tbody>
   ${Object.values(weeks).map(w=>{const m=w.ok+w.late+w.bad;return `<tr><td><button class="btn" data-week="${w.s}">${+w.s.slice(8)}–${+w.e.slice(8)}/${+w.s.slice(5,7)}</button></td><td class="c">${w.ok}</td><td class="c">${w.late}</td><td class="c">${w.bad}</td><td class="c">${w.un}</td><td class="c">${m?Math.round((w.ok+w.late)/m*100)+'%':'—'}</td></tr>`}).join('')}
   </tbody></table></div></div>
   <div class="section"><h3>انضباط المعلمين</h3>${teachersTable(W)}</div>`+msgBlock('رسالة التقرير الشهري للمدير',W.text,'rep-month')}

     <div class="acts">
      ${r.l?`<a class="btn" href="${esc(r.l)}" target="_blank" rel="noopener">${IC.teams} Teams</a>`:`<span class="pill bad">بلا رابط</span>`}
      <div class="seg" role="group" aria-label="حالة المعلم">${['ok','late','bad'].map(v=>`<button data-k="${esc(k)}" data-t="${esc(r.t)}" data-v="${v}" aria-pressed="${m&&m.st===v}">${ST[v]}</button>`).join('')}</div>
      ${ph?(apiOn()?`<button class="btn wa ${hotWA(k,m,sent)?'hot':''}" data-api="${esc(k)}" type="button">${IC.wa} ${sent?'إعادة التذكير':'إرسال تذكير'}</button>`:`<a class="btn wa ${hotWA(k,m,sent)?'hot':''}" data-sent="${esc(k)}" href="${esc(waUrl(r.ph,remindText(r,V.date)))}" target="_blank" rel="noopener">${IC.wa} تذكير</a>`):`<span class="pill">لا جوال</span>`}
     </div>

/* ============ جوالات المعلمين: لصق ومطابقة، رابط تسجيل ذاتي، جدول تعبئة ============ */
const PH_RE=/(?:\+?966|00966|0)?5\d{8}/;
function cleanPh(s){const d=String(s||'').replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/[\s\-().]/g,'');const m=d.match(PH_RE);if(!m)return'';return '05'+m[0].slice(-8)}
function nameToks(s){return normAr(String(s||'').replace(/(ال)?(استاذ|أستاذ|الأستاذ|معلم|المعلم)\s*[/.:]?/g,' ').replace(/[^؀-ۿ\s]/g,' '))
  .replace(/(^|\s)عبد\s+/g,'$1عبد').replace(/(^|\s)ابو\s+/g,'$1ابو').split(' ').filter(w=>w.length>1&&!['بن','ابن','بنت','ال'].includes(w))}
function teachersList(){return [...new Set(S.rows.map(r=>r.t))].sort((a,b)=>a.localeCompare(b,'ar'))}
function matchTeacher(name,list){const q=nameToks(name);if(!q.length)return null;let best=null,bs=0,second=0;
  for(const t of list){const w=nameToks(t);if(!w.length)continue;let s=0;if(w[0]===q[0])s+=2;else continue;
    const last=q[q.length-1];if(q.length>1&&w[w.length-1]===last)s+=2;q.slice(1).forEach(x=>{if(w.includes(x))s+=1});
    if(q.length>1&&q.every(x=>w.includes(x)))s+=1;
    if(s>bs){second=bs;bs=s;best=t}else if(s>second)second=s}
  return bs>=(q.length>1?4:2)&&bs>second?best:null}
function parsePhoneList(txt){const out=[];let pend='';
  String(txt||'').split(/\r?\n/).forEach(line=>{const ph=cleanPh(line);const nm=line.replace(/[0-9٠-٩+\-().]/g,' ').replace(/[,\t;|:،]/g,' ').replace(/\s+/g,' ').trim();
    if(ph){const n=/[؀-ۿ]{2,}/.test(nm)?nm:pend;if(n)out.push({name:n,ph});pend=''}else if(/[؀-ۿ]{2,}/.test(nm))pend=nm});
  return out}
function phStats(){const T=teachersList();const has=new Set(S.rows.filter(r=>cleanPh(r.ph)).map(r=>r.t));return{T,miss:T.filter(t=>!has.has(t))}}
function phoneOf(t){const r=S.rows.find(x=>x.t===t&&x.ph);return r?r.ph:''}
function setPhone(t,ph){let n=0;S.rows.forEach(r=>{if(r.t===t){r.ph=ph;n++}});return n}

   ${EXT?`<details><summary class="small" style="cursor:pointer;font-weight:600;color:var(--accent)">طرق أخرى (عند الحاجة فقط)${st.miss.length?` · ينقص ${st.miss.length} رقم`:''}</summary><div style="display:grid;gap:14px;margin-top:10px">`:''}

/* ============ قراءة الجدول ============ */
function csvParse(t){const out=[];let row=[],c='',q=false;t=t.replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','||ch==='\t'||ch===';'){row.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);out.push(row);row=[];c=''}else c+=ch}
  if(c||row.length){row.push(c);out.push(row)}return out}
const normAr=s=>String(s||'').trim().replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ');
function dayIdx(v){const s=normAr(v);const n=parseInt(s,10);if(n>=1&&n<=5&&/^\d+$/.test(s))return n-1;
  const names=['احد','اثنين','ثلاثاء','اربعاء','خميس'];for(let i=0;i<5;i++)if(s.replace(/^ال/,'').includes(names[i].replace(/ه$/,'')))return i;
  if(s.includes('ثلاث'))return 2;if(s.includes('ربع'))return 3;return -1}
function parseAOA(aoa){
  const hi=aoa.findIndex(r=>r&&r.some(c=>normAr(c).includes('معلم'))&&r.some(c=>/صف|فصل/.test(normAr(c))));
  if(hi<0)throw new Error('لم أجد صف العناوين (اليوم، الحصة، الصف، المعلم…). استخدم القالب أو انسخ الجدول مع صف العناوين.');
  const H=aoa[hi].map(normAr);const col=(...ks)=>H.findIndex(h=>ks.some(k=>h.includes(k)));
  const cD=col('يوم'),cP=col('حصه','حصة'),cC=col('صف','فصل'),cT=col('معلم'),cPh=col('جوال','هاتف','رقم','موبايل'),cL=col('رابط','teams','link'),cLs=col('عنوان الدرس','درس'),cSb=col('ماده');
  if([cD,cP,cC,cT].some(x=>x<0))throw new Error('الأعمدة الأساسية ناقصة: اليوم، الحصة، الصف، المعلم');
  const rows=[];let bad=0;const seen=new Set();
  aoa.slice(hi+1).forEach(r=>{if(!r||r.every(c=>String(c).trim()===''))return;const d=dayIdx(r[cD]);const p=parseInt(String(r[cP]).replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)),10);
    const c=String(r[cC]||'').trim(),t=String(r[cT]||'').trim().replace(/^(ال)?(استاذ|أستاذ)\s*[/.:]?\s*|^أ\s*[/.]\s*/,'');
    if(d<0||!(p>=1&&p<=7)||!c||!t){bad++;return}
    const key=d+'|'+p+'|'+c;if(seen.has(key))return;seen.add(key);
    const les=String((cLs>=0&&r[cLs])||(cSb>=0&&r[cSb])||'').replace(/\s+/g,' ').trim().slice(0,90);
    let l=cL>=0?String(r[cL]||'').trim():'';if(l&&!/^https?:\/\//i.test(l))l='';
    const o={d,p,c,t,ph:cPh>=0?String(r[cPh]||'').trim():'',l};if(les)o.s=les;rows.push(o)});
  if(!rows.length)throw new Error('لم تُقرأ أي حصة صالحة');
  return{rows,bad}}
function textToAOA(txt){txt=txt.replace(/^﻿/,'');if(txt.includes('\t'))return txt.split(/\r?\n/).map(l=>l.split('\t'));return csvParse(txt)}
async function fileToAOA(f){const isCSV=/\.csv$|\.txt$/i.test(f.name)||/text\//.test(f.type);
  if(isCSV){const txt=await f.text();return window.XLSX?XLSX.utils.sheet_to_json(XLSX.read(txt,{type:'string'}).Sheets[XLSX.read(txt,{type:'string'}).SheetNames[0]],{header:1,defval:''}):textToAOA(txt)}
  if(!window.XLSX)throw new Error('تعذّر تحميل قارئ Excel، احفظ الملف CSV أو الصق الجدول');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false})}
/* تحديث الجدول (مثل الخطة الأسبوعية من مدرستي) دون فقد الجوالات والروابط المحفوظة */
function keepOld(rows){if(S.demo||!S.rows.length)return 0;const nk=s=>normAr(s).replace(/\s/g,'');
  const ph={},lk={},lk2={};S.rows.forEach(r=>{if(r.ph)ph[nk(r.t)]=r.ph;if(r.l){lk[r.c+'|'+nk(r.t)]=r.l;lk2[r.d+'|'+r.p+'|'+r.c]=r.l}});
  let n=0;rows.forEach(r=>{const t=nk(r.t);if(!r.ph&&ph[t]){r.ph=ph[t];n++}if(!r.l){const l=lk[r.c+'|'+t]||lk2[r.d+'|'+r.p+'|'+r.c];if(l){r.l=l;n++}}});return n}
function applyRows(res){
  const kept=keepOld(res.rows);
  if(S.demo){S.marks={};S.sent={};S.settings.school=S.settings.school.includes('تجريبية')?'اسم مدرستك':S.settings.school;S.settings.mgr='';S.settings.mgrPh='';S.settings.pin='';S.settings.fpin='';S.settings.fols=[]}
  S.rows=res.rows;S.demo=false;save();V.date=null;V.p=null;render();
  toast(`حُمّل ${res.rows.length} حصة`+(kept?` · احتُفظ بالجوالات والروابط السابقة`:'')+(res.bad?` · تُجوهل ${res.bad} سطر غير مكتمل`:''))}
async function readSchedule(f){try{applyRows(parseAOA(await fileToAOA(f)))}catch(e){toast(String(e.message||'تعذّرت قراءة الملف'))}}

function weekInsights(W){const prev=weekData(addD(W.days[0],-7));const per={},day={};
  W.days.forEach(ds=>{const k=wd(ds);if(k<0)return;S.rows.filter(r=>r.d===k).forEach(r=>{const m=S.marks[mk(ds,r.p,r.c)];if(!m||m.st==='ok')return;per[r.p]=(per[r.p]||0)+1;day[k]=(day[k]||0)+(m.st==='bad'?1:0)})});
  const tp=Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,3),td=Object.entries(day).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,2);
  const pm=prev.T.ok+prev.T.late+prev.T.bad,delta=pm?W.pct-prev.pct:null;
  const lines=[];if(delta!=null)lines.push(`${delta>=0?'▲':'▼'} ${Math.abs(delta)}% عن الأسبوع الماضي (${prev.pct}%)`);
  if(tp.length)lines.push('أكثر الحصص تأخرًا/غيابًا: '+tp.map(([p,n])=>`الحصة ${p} (${n})`).join('، '));
  if(td.length)lines.push('أكثر الأيام غيابًا: '+td.map(([d,n])=>`${DAYS[d]} (${n})`).join('، '));
  return{delta,prev,tp,td,lines}}

   ${I.tp.length?`<div class="small">⏱ أكثر الحصص تأخرًا أو غيابًا: <b>${I.tp.map(([p,n])=>`الحصة ${p} (${n})`).join('، ')}</b></div>`:''}${I.td.length?`<div class="small">❌ أكثر الأيام غيابًا: <b>${I.td.map(([d,n])=>`${DAYS[d]} (${n})`).join('، ')}</b></div>`:''}</div></div>`}

/* ---- روابط Teams من تقويم Outlook/Teams (ملف .ics) ---- */
function icsParse(txt){const lines=String(txt).replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').split(/\r?\n/);const ev=[];let cur=null;
  for(const ln of lines){if(ln==='BEGIN:VEVENT'){cur={};continue}if(ln==='END:VEVENT'){if(cur)ev.push(cur);cur=null;continue}if(!cur)continue;
    const i=ln.indexOf(':');if(i<0)continue;const head=ln.slice(0,i),val=ln.slice(i+1);const name=head.split(';')[0].toUpperCase();
    if(name==='DTSTART'){cur.start=val;cur.z=/Z$/.test(val)}else if(name==='RRULE')cur.rrule=val;else if(name==='SUMMARY')cur.sum=val;else if(name==='DESCRIPTION')cur.desc=val;else if(name==='LOCATION')cur.loc=val;
    else if(name==='ORGANIZER'){const m=head.match(/CN=("?)([^;:"]+)\1/i);cur.org=m?m[2]:''}else if(name==='X-MICROSOFT-SKYPETEAMSMEETINGURL')cur.url=val}
  return ev.map(e=>{const all=[e.url,e.desc,e.loc].join(' ').replace(/\\n/g,' ').replace(/\\,/g,',').replace(/\\;/g,';');const m=all.match(/https:\/\/teams\.microsoft\.com\/l\/meetup-join\/[^\s"<>\\]+/i);
    const s=e.start||'';const y=+s.slice(0,4),mo=+s.slice(4,6),d=+s.slice(6,8),h=+s.slice(9,11)||0,mi=+s.slice(11,13)||0;let dt=e.z?new Date(Date.UTC(y,mo-1,d,h,mi)):new Date(y,mo-1,d,h,mi);
    const days=[];const by=(e.rrule||'').match(/BYDAY=([A-Z,0-9-]+)/);if(by)by[1].split(',').forEach(x=>{const k=['SU','MO','TU','WE','TH'].indexOf(x.replace(/[^A-Z]/g,''));if(k>=0)days.push(k)});else if(dt.getDay()<=4)days.push(dt.getDay());
    return{link:m?m[0]:'',days,min:dt.getHours()*60+dt.getMinutes(),text:normAr([e.sum,e.desc&&e.desc.slice(0,300)].join(' ')),org:e.org||'',sum:e.sum||''}}).filter(x=>x.link&&x.days.length)}
function icsMatch(evs,overwrite){const res=[];const used=new Set();const nk=s=>normAr(s).replace(/\s/g,'');
  for(const e of evs){let p=0;S.settings.times.forEach((t,i)=>{if(Math.abs(mins(t[0])-e.min)<=15)p=i+1});if(!p)continue;
    for(const d of e.days){const cand=S.rows.filter(r=>r.d===d&&r.p===p);if(!cand.length)continue;
      let hit=cand.filter(r=>e.text.replace(/\s/g,'').includes(nk(r.c)));
      if(hit.length!==1){const T=[...new Set((hit.length?hit:cand).map(r=>r.t))];const mt=matchTeacher(e.org||e.sum,T);if(mt)hit=(hit.length?hit:cand).filter(r=>r.t===mt)}
      if(hit.length!==1)continue;const r=hit[0];const key=r.d+'|'+r.p+'|'+r.c;if(used.has(key))continue;used.add(key);
      if(!r.l||overwrite&&r.l!==e.link)res.push({r,link:e.link,old:r.l})}}
  return res}
function icsHTML(){if(isFol())return'';const noL=S.rows.filter(r=>!r.l).length;return `<div class="card" style="display:grid;gap:8px;margin-top:4px"><b>🔗 روابط Teams من التقويم ${noL?`<span class="pill late">${noL} حصة بلا رابط</span>`:'<span class="pill ok">مكتملة</span>'}</b>
   <p class="small muted" style="margin:0">صدّر تقويم الحصص من Outlook أو Teams بصيغة ‎.ics‎ وارفعه هنا، فيطابق راصد كل اجتماع مع الحصة (اليوم والوقت والفصل أو المعلم) ويضع رابطها. الملف يُقرأ على جهازك فقط.</p>
   <div class="bar-row" style="margin:0"><label class="btn primary" for="icsF">${IC.up} رفع ملف التقويم (.ics)</label><input type="file" id="icsF" accept=".ics,text/calendar" hidden>
   <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="icsOver"> استبدال الروابط الموجودة إن اختلفت</label></div></div>`}
function bindIcs(){const f=$('#icsF');if(f)f.onchange=async()=>{const file=f.files[0];if(!file)return;try{const ev=icsParse(await file.text());if(!ev.length){toast('لم أجد اجتماعات Teams في الملف');return}
  const res=icsMatch(ev,$('#icsOver').checked);if(!res.length){toast(`قُرئ ${ev.length} اجتماع، ولم يُطابَق جديد`);return}
  const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div><h2 style="font-size:18px">روابط من التقويم</h2><p class="small muted" style="margin:0">قُرئ ${ev.length} اجتماع، وطوبق ${res.length} حصة.</p>
   <div class="tbl"><table><thead><tr><th>اليوم</th><th>الحصة</th><th>الفصل</th><th>المعلم</th><th>الحالة</th></tr></thead><tbody>${res.slice(0,300).map(x=>`<tr><td>${DAYS[x.r.d]}</td><td class="num">${x.r.p}</td><td>${esc(x.r.c)}</td><td>${esc(x.r.t)}</td><td>${x.old?'استبدال':'جديد'}</td></tr>`).join('')}</tbody></table></div>
   <div class="bar-row"><button class="btn primary" id="icsOk">اعتماد</button><button class="btn" id="icsNo">إلغاء</button></div></div>`;document.body.append(d);
  d.querySelector('#icsNo').onclick=()=>d.remove();d.querySelector('#icsOk').onclick=()=>{res.forEach(x=>{x.r.l=x.link});d.remove();save();render();toast(`أُضيف ${res.length} رابط`)}}
  catch(e){toast('تعذّر قراءة الملف')}f.value=''}}

   ${Object.keys(byK).length?`<div class="small muted">${Object.entries(byK).map(([k,n])=>`${k}: <b>${n}</b>`).join(' · ')}</div>`:''}
   ${srvErr?`<div class="alertbar">تعذّر جلب سجل الخادم: ${esc(srvErr)}</div>`:''}
   ${!S.sync?'<p class="small muted" style="margin:0">يعرض ما أُرسل من هذا الجهاز. فعّل المزامنة ليظهر سجل الإرسال من الخادم أيضًا.</p>':''}
   ${rows.length?`<div class="tbl" style="max-height:60vh;overflow:auto"><table class="num"><thead><tr><th>الوقت</th><th>النوع</th><th>بخصوص</th><th>الحصة</th><th>الجوال</th><th>الطريقة</th><th>الحالة</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${days>1?esc(r.day.slice(5))+' ':''}${esc(r.time)}</td><td>${esc(r.kind)}</td><td>${r.who?'الأستاذ/ '+esc(r.who):'—'}</td><td>${esc(r.where)||'—'}</td><td dir="ltr">${esc(r.to)||'—'}</td><td>${esc(r.via)}</td><td>${r.ok?'<span class="pill ok">أُرسلت</span>':`<span class="pill bad" title="${esc(r.err)}">تعذّر</span><div class="small" style="color:var(--bad);white-space:normal;max-width:240px">${esc(r.err)}</div>`}</td></tr>`).join('')}</tbody></table></div>
    <div class="bar-row" style="margin:0"><button class="btn" data-acsv>${IC.dl} تصدير CSV</button></div>`:'<div class="empty" style="margin:0">لا رسائل في هذه المدة.</div>'}</div>`;
  el.addEventListener('click',e=>{if(e.target===el||e.target.closest('[data-ax]')){el.remove();return}const a=e.target.closest('[data-ad]');if(a){e.preventDefault();openArchive(+a.dataset.ad);return}
    if(e.target.closest('[data-acsv]')){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='﻿'+[['التاريخ','الوقت','النوع','بخصوص','الحصة','الجوال','الطريقة','الحالة','الخطأ'],...rows.map(r=>[r.day,r.time,r.kind,r.who,r.where,r.to,r.via,r.ok?'أُرسلت':'تعذّر',r.err])].map(x=>x.map(q).join(',')).join('\n');
      saveFile(`أرشيف-الإرسال-${today()}.csv`,csv,'text/csv')}});
  document.body.append(el)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-archive]');if(b){e.preventDefault();openArchive(1)}});

addEventListener('hashchange',route);
setInterval(()=>{const c=$('#clock');if(c)c.textContent=hm()},15000);
pushCfg();
route();
